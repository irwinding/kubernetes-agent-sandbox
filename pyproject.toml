[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langchain_kubernetes_agent_sandbox"]

[project]
name = "langchain-kubernetes-agent-sandbox"
version = "0.1.3"
description = "A LangChain sandbox tool that runs agent-generated code inside Kubernetes pods"
readme = "README.md"
requires-python = ">=3.12"
license = {text="MIT"}
authors = [{ name = "Irwin Ding", email = "dingirwin.99@gmail.com"}]
keywords = ["langchain", "kubernetes", "sandbox", "agent"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "deepagents>=0.6.1",
    "k8s-agent-sandbox>=0.4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "langchain-tests>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/irwinding/langchain-kubernetes-agent-sandbox"
Issues   = "https://github.com/irwinding/langchain-kubernetes-agent-sandbox/issues"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = ""
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
upload_to_pypi = false
upload_to_release = true

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "chore", "test", "ci", "build", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
