[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langchain_kubernetes_agent_sandbox"]

[project]
name = "kubernetes-agent-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.1",
    "k8s-agent-sandbox>=0.4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "langchain-tests>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
